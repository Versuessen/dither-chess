# Tests, model packs, end-to-end tests and desktop installers.
#
# Every push and pull request: type check, unit tests, end-to-end tests (the app, and the website
# build on a plain static host). The model conversion (up to 2 hours) and the six installer builds
# run on version tags (v*) and when started by hand (Actions → ci → Run workflow): in a private
# repository they would use up GitHub's free Actions minutes within a few pushes.
#
# Secrets (optional; without them the RPM is signed with a throwaway key so that the
# install-with-gpgcheck path is still exercised, and nothing is published):
#   RPM_SIGNING_KEY         ASCII-armoured private key used by `rpm --addsign`
#   RPM_SIGNING_PASSPHRASE  its passphrase
name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch replaces a run still in progress (tags and pull requests too).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test

  models:
    # Converts, verifies (parity on 2,016 positions) and packs the models from pinned sources: a
    # check that the pipeline still reproduces them. The other jobs, and the web app on Pages, use
    # the committed packs, which models/manifest.json pins by SHA-256 (a rebuilt pack embeds this
    # run's parity report, so its checksum differs).
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      # The website the desktop app downloads packs from (repository variable, if set).
      DITHER_SITE_URL: ${{ vars.DITHER_SITE_URL || 'https://dither-chess.vercel.app' }}
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - uses: actions/cache@v6
        with:
          path: tools/models/work
          key: models-work-${{ hashFiles('tools/models/sources.lock.json', 'tools/models/src/**', 'tools/models/uv.lock') }}
      - run: uv run dither-models all
        working-directory: tools/models
      - uses: actions/upload-artifact@v7
        with:
          name: model-packs
          path: |
            models/manifest.json
            models/packs/*.dpk
          retention-days: 14
      - uses: actions/upload-artifact@v7
        with:
          name: model-reports
          path: tools/models/reports/
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Golden tests now run the exported models through onnxruntime-web and must not skip.
      - run: pnpm test
        env:
          DITHER_REQUIRE_MODELS: '1'

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Model packs (SHA-256 checked against models/manifest.json)
        run: pnpm models:fetch
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
        env:
          CI: '1'
      - name: The website build on a plain static host (preinstalled models, source archive)
        run: pnpm test:static
        env:
          CI: '1'
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-reports
          path: |
            playwright-report/
            playwright-report-static/

  windows:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [standard, offline]
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - name: Model packs (SHA-256 checked against models/manifest.json)
        run: pnpm models:fetch
      - name: Build NSIS and MSI installers
        shell: pwsh
        run: |
          $extra = if ('${{ matrix.variant }}' -eq 'offline') { @('--config', 'src-tauri/tauri.offline.conf.json') } else { @() }
          pnpm tauri build --bundles nsis,msi @extra
      - name: Smoke-test the per-user installers
        shell: pwsh
        run: ./packaging/windows/smoke.ps1 -Variant ${{ matrix.variant }}
      - uses: actions/upload-artifact@v7
        with:
          name: windows-${{ matrix.variant }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

  fedora:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        fedora: ['44', '45']
        variant: [standard, offline]
    container:
      image: registry.fedoraproject.org/fedora:${{ matrix.fedora }}
    steps:
      - name: Build dependencies
        run: |
          dnf -y install git nodejs npm rust cargo gcc gcc-c++ make rpm-build rpm-sign gnupg2 pinentry python3 \
            webkit2gtk4.1-devel gtk3-devel libsoup3-devel openssl-devel librsvg2-devel libappindicator-gtk3-devel \
            file wget xorg-x11-server-Xvfb xorg-x11-xauth mesa-dri-drivers dbus-x11 fuse-libs
          npm install -g corepack && corepack enable
      - uses: actions/checkout@v6
      - run: pnpm install --frozen-lockfile
      - name: Model packs (SHA-256 checked against models/manifest.json)
        run: pnpm models:fetch
      - name: Build RPM and AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          extra=""
          if [ "${{ matrix.variant }}" = offline ]; then extra="--config src-tauri/tauri.offline.conf.json"; fi
          pnpm tauri build --bundles rpm,appimage $extra
      - name: Sign the RPM (rpm --addsign) and verify it
        env:
          RPM_SIGNING_KEY: ${{ secrets.RPM_SIGNING_KEY }}
          RPM_SIGNING_PASSPHRASE: ${{ secrets.RPM_SIGNING_PASSPHRASE }}
        run: packaging/linux/sign-rpm.sh src-tauri/target/release/bundle/rpm/*.rpm
      - name: Install with signature checking and smoke-test
        run: packaging/linux/smoke.sh ${{ matrix.variant }}
      - uses: actions/upload-artifact@v7
        with:
          name: fedora${{ matrix.fedora }}-${{ matrix.variant }}
          path: |
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
            packaging/linux/out/dither-rpm-signing.asc
