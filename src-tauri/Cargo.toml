[package]
name = "dither"
version = "0.1.0"
description = "Offline chess practice against human-like neural bots"
authors = ["DITHER contributors"]
license = "AGPL-3.0-or-later"
edition = "2024"
rust-version = "1.85"

[lib]
name = "dither_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-sql = { version = "2.6", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "http2"] }
futures-util = "0.3"
tokio = { version = "1", features = ["fs", "io-util", "sync"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
